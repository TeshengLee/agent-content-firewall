[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-content-firewall"
version = "0.4.0"
description = "Local deterministic preflight scanning for untrusted agent content"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
pdf = ["pdf-injection-scanner==0.2.0"]

[project.scripts]
agent-content-firewall = "content_trust_gateway.cli:main"
content-trust = "content_trust_gateway.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/content_trust_gateway"]
