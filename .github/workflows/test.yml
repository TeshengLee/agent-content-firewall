name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff
      - run: ruff check src adapters/common_hook.py adapters/policy_hook.py scripts tests
      - run: ruff format --check src adapters/common_hook.py adapters/policy_hook.py scripts tests
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: python scripts/privacy_audit.py
